<div class="app-shell" [attr.inert]="activeModal() ? '' : null" [attr.aria-hidden]="activeModal() ? 'true' : null">
  <app-header
    (playlistsRequested)="openModal('playlists')"
    (settingsRequested)="openModal('settings')"
  />

  <app-audio-player />

  <main class="content">
    <app-search-bar [currentSongList]="songSearchController.songList()" />
    <app-song-table
      [songTable]="songSearchController.songList()"
      [animeTitleLang]="animeTitleLang()"
      [currentAudioSong]="audioPlayback.currentSong()"
      [searchRevision]="songSearchController.searchRevision()"
      [resultOrder]="songSearchController.resultOrder()"
      [showAmqSongId]="preferences().showAmqSongId"
      (playAudioRequested)="audioPlayback.play($event)"
      (songTableChange)="updateSongList($event)"
      (managePlaylistsRequested)="openModal('playlists')"
      (notificationRequested)="showNotification($event)"
    />
    <p class="amq-disclaimer">
      Built on the <a href="https://animemusicquiz.com/" target="_blank" rel="noopener">AMQ</a>
      database. This is a personal project, not affiliated. Support AMQ on
      <a href="https://www.patreon.com/NextWorldGames" target="_blank" rel="noopener">Patreon</a>.
    </p>
  </main>
</div>

@if (activeModal() === 'settings') {
  <app-settings-dialog (closed)="closeModal()" />
} @else if (activeModal() === 'playlists') {
  <app-playlist-dialog (closed)="closeModal()" />
}

<app-toast-outlet />
