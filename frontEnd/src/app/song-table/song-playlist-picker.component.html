<div class="app-modal-backdrop playlist-picker-backdrop" (click)="closed.emit()">
  <div
    class="app-modal-surface playlist-picker"
    appModalFocusTrap
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="playlist-picker-title"
    (click)="$event.stopPropagation()"
  >
    <div class="app-modal-header playlist-picker-header">
      <h2 id="playlist-picker-title">Add to playlist</h2>
      <button
        id="playlist-picker-close"
        data-modal-initial-focus
        type="button"
        class="app-icon-button app-modal-close playlist-picker-close"
        title="Close"
        aria-label="Close"
        (click)="closed.emit()"
      >
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <div class="playlist-picker-body">
      <div class="playlist-picker-song">
        <span class="playlist-picker-label">Song</span>
        <span class="playlist-picker-song-value">{{ song().songName }} by {{ song().songArtist }}</span>
      </div>
      @if (playlistService.playlists().length) {
        <div class="playlist-picker-controls">
          <label class="playlist-picker-label" for="playlist-picker-select">Playlist</label>
          <select
            id="playlist-picker-select"
            class="app-select playlist-picker-select"
            [value]="selectedPlaylistId() ?? ''"
            (change)="selectPlaylist($any($event.target).value)"
          >
            @for (playlist of sortedPlaylists(); track playlist.id) {
              <option [value]="playlist.id">{{ playlist.name }} ({{ formatSongCount(playlist.annSongIds.length) }})</option>
            }
          </select>
          <button
            id="playlist-picker-toggle-song"
            type="button"
            class="app-button app-button--full playlist-picker-add"
            [disabled]="!canToggleSong()"
            (click)="toggleSong()"
          >
            <i
              class="fa"
              [class.fa-plus]="!selectedPlaylistContainsSong()"
              [class.fa-minus]="selectedPlaylistContainsSong()"
              aria-hidden="true"
            ></i>
            {{ selectedPlaylistContainsSong() ? 'Remove' : 'Add' }}
          </button>
        </div>
        <label class="app-checkbox playlist-picker-auto-add">
          <input
            type="checkbox"
            [checked]="autoAddToPlaylist()"
            (change)="setAutoAddToPlaylist($any($event.target).checked)"
          />
          Auto add songs to this playlist (skip this menu)
        </label>
      } @else {
        <p class="playlist-picker-empty">Create a playlist first.</p>
        <button
          id="playlist-picker-manage"
          type="button"
          class="app-button app-button--full playlist-picker-manage"
          (click)="managePlaylists()"
        >
          Manage playlists
        </button>
      }
    </div>
  </div>
</div>
